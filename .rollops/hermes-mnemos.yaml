apiVersion: rollops.klarlabs.de/v1
kind: RolloutConfig
metadata:
  name: hermes-mnemos
spec:
  target:
    kind: kubernetes
    ref: hermes/prod/mnemos
    criticality: high
    spec:
      namespace: hermes
      resource: deployment/mnemos
      image: ghcr.io/klarlabs-studio/mnemos:latest@sha256:5b2597944afcb9a00f073ca633cceee02c20f03dc193db85575abfa373b91d8c
      manifest: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          labels:
            app.kubernetes.io/name: mnemos
          name: mnemos
          namespace: hermes
        spec:
          progressDeadlineSeconds: 600
          replicas: 1
          revisionHistoryLimit: 10
          selector:
            matchLabels:
              app.kubernetes.io/name: mnemos
          strategy:
            type: Recreate
          template:
            metadata:
              annotations:
                kubectl.kubernetes.io/restartedAt: '2026-05-31T20:31:16+02:00'
              labels:
                app.kubernetes.io/name: mnemos
            spec:
              containers:
              - args:
                - serve
                - --port
                - '7777'
                env:
                - name: MNEMOS_DATA_DIR
                  value: /data
                - name: HOME
                  value: /data
                image: ghcr.io/klarlabs-studio/mnemos:latest
                imagePullPolicy: Always
                livenessProbe:
                  failureThreshold: 3
                  httpGet:
                    path: /health
                    port: 7777
                    scheme: HTTP
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  successThreshold: 1
                  timeoutSeconds: 1
                name: mnemos
                ports:
                - containerPort: 7777
                  name: http
                  protocol: TCP
                readinessProbe:
                  failureThreshold: 3
                  httpGet:
                    path: /health
                    port: 7777
                    scheme: HTTP
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  successThreshold: 1
                  timeoutSeconds: 1
                resources:
                  limits:
                    cpu: 500m
                    memory: 512Mi
                  requests:
                    cpu: 50m
                    memory: 96Mi
                terminationMessagePath: /dev/termination-log
                terminationMessagePolicy: File
                volumeMounts:
                - mountPath: /data
                  name: data
              dnsPolicy: ClusterFirst
              # No nodeSelector. This used to pin to edge-1 because mnemos-data was
              # a local-path volume — a directory that existed only on that node —
              # and edge-1 is also the only control-plane node, so the brain and
              # the cluster shared a single point of failure. The volume is
              # Longhorn now, with a replica on each node, so the pod is free to
              # move and the scheduler can balance it.
              restartPolicy: Always
              schedulerName: default-scheduler
              securityContext: {}
              terminationGracePeriodSeconds: 30
              volumes:
              - name: data
                persistentVolumeClaim:
                  claimName: mnemos-data
  strategy:
    type: rolling
  verification: shallow
  imagePolicy:
    mode: digest
    allowMutableTags: true
    # main is protected, so rollopsd cannot push the digest re-pin directly
    # (GH006). Propose it as an auto-merging PR instead (rollops v0.28.0+).
    # Needs the rollops GitHub App to have "Pull requests: write".
    writeback: pull-request
