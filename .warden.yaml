# Publish the gate's verdict as the warden/gate commit status, so a push
# carries evidence that the checks ran on the machine that made it.
#
# This block used to say Actions cannot run here while the spending limit
# holds, and that branch protection therefore requires warden/gate INSTEAD
# of the CI checks. That is true of the org's private repos; mnemos is
# public, so its Actions have always run. Carried over unedited, the
# comment justified protection that required warden/gate and nothing else
# — which is how main stayed red for three days in August 2026 with
# nothing blocking a merge. Protection now requires the ci/* checks too,
# and warden/gate alongside them rather than in their place.
status:
  enabled: true

# warden gate — https://github.com/klarlabs-studio/warden
# Any dev with warden installed gets the same checks CI runs, pre-commit/pre-push.
hooks: { pre_commit: true, pre_push: true }
commands:
  # The gate that found the fleet-wide toolchain problem. It ran only in
  # GitHub Actions, and this repository no longer requires those checks —
  # so without this line, switching to warden/gate would delete it.
  vulns: "go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./..."
  lint: "golangci-lint run --allow-parallel-runners ./..."
  test: "go test -race ./..."
  cross: "make cross"
steps:
  pre_commit: [lint]
  pre_push: [test, lint, cross, vulns]
parallel: true
